<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão Copa 2026 🏆</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;600&display=swap');
  :root {
    --verde:#00843D; --amarelo:#FFD700; --azul:#002776;
    --bg:#0a0e1a; --bg2:#111827; --bg3:#1a2235; --card:#1e2d45;
    --border:#2a3f5f; --text:#e8eaf0; --muted:#7a8aaa;
    --acerto-placar:#00ff88; --acerto-vencedor:#FFD700; --erro:#ff4d6d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  header{background:linear-gradient(135deg,var(--azul) 0%,#001a55 50%,var(--verde) 100%);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--amarelo);position:sticky;top:0;z-index:100}
  .header-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--amarelo)}
  .header-title span{color:#fff}

  .ranking-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ranking-label{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:var(--muted)}
  .ranking-item{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 12px}
  .ranking-pos{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--muted)}
  .ranking-pos.gold{color:#FFD700}.ranking-pos.silver{color:#C0C0C0}.ranking-pos.bronze{color:#CD7F32}
  .ranking-name{font-weight:600;font-size:13px;min-width:60px}
  .ranking-pts{font-family:'Roboto Mono',monospace;font-size:15px;font-weight:600;color:var(--amarelo)}

  /* PARTICIPANTES MANAGER */
  .participantes-bar{background:var(--bg3);border-bottom:1px solid var(--border);padding:6px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .participantes-label{font-size:11px;color:var(--muted);font-family:'Roboto Mono',monospace}
  .participante-chip{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
  .participante-chip .remove-btn{cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 0 0 4px}
  .participante-chip .remove-btn:hover{color:var(--erro)}
  .add-participante{display:flex;align-items:center;gap:6px}
  .add-participante input{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:4px 8px;width:110px}
  .add-participante input:focus{outline:none;border-color:var(--amarelo)}
  .add-participante button{background:var(--verde);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer}

  .tabs{background:var(--bg2);padding:0 16px;display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto}
  .tab{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;padding:10px 16px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;background:none;border-left:none;border-right:none;border-top:none;transition:all .2s}
  .tab:hover{color:var(--text)}.tab.active{color:var(--amarelo);border-bottom-color:var(--amarelo)}

  .main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;height:calc(100vh - 148px)}
  .col{overflow-y:auto;border-right:1px solid var(--border);padding:12px}
  .col:last-child{border-right:none}
  .col-header{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--amarelo);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}

  .game-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s;position:relative}
  .game-card:hover{border-color:var(--amarelo)}.game-card.selected{border-color:var(--amarelo);background:#1e2d45ee}
  .game-meta{font-size:10px;color:var(--muted);font-family:'Roboto Mono',monospace;margin-bottom:6px;display:flex;justify-content:space-between}
  .game-teams{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .team-block{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
  .team-block.home{align-items:flex-end}.team-block.away{align-items:flex-start}
  .team-flag-img{width:28px;height:20px;object-fit:cover;border-radius:2px;border:1px solid rgba(255,255,255,0.1)}
  .team-name{font-weight:700;font-size:12px;text-align:center}
  .vs-sep{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--muted);flex-shrink:0}
  .game-venue{font-size:9px;color:var(--muted);text-align:center;margin-top:4px}
  .game-status-badge{position:absolute;top:6px;right:6px;font-size:9px;font-family:'Roboto Mono',monospace;font-weight:600;padding:2px 5px;border-radius:3px}
  .badge-upcoming{background:#1a2235;color:var(--muted);border:1px solid var(--border)}
  .badge-done{background:#002200;color:var(--acerto-placar);border:1px solid #004400}
  .grupo-label{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;color:var(--muted);padding:6px 0 2px}

  .palpite-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
  .palpite-game-info{font-size:11px;color:var(--muted);margin-bottom:6px;font-family:'Roboto Mono',monospace}
  .palpite-game-name{font-weight:700;font-size:13px;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .palpite-jogador{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .jogador-label{font-size:12px;font-weight:600;width:70px;color:var(--muted);flex-shrink:0}
  .placar-inputs{display:flex;align-items:center;gap:5px}
  .placar-inputs input{width:38px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Roboto Mono',monospace;font-size:15px;font-weight:600;padding:4px}
  .placar-inputs input:focus{outline:none;border-color:var(--amarelo)}
  .placar-sep{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--muted)}
  .btn-salvar-small{margin-left:6px;padding:3px 9px;background:var(--verde);color:#fff;border:none;border-radius:6px;font-size:11px;cursor:pointer;font-family:'Bebas Neue',sans-serif;letter-spacing:1px}
  .btn-salvar-small:hover{background:#009e4a}
  .resultado-form{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
  .resultado-label{font-size:10px;color:var(--muted);font-family:'Roboto Mono',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
  .btn-resultado{padding:5px 12px;background:var(--azul);color:var(--amarelo);border:1px solid var(--amarelo);border-radius:6px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer}
  .btn-resultado:hover{background:#003a99}

  .comp-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
  .comp-game-name{font-weight:700;font-size:12px;margin-bottom:4px}
  .comp-resultado-real{font-family:'Roboto Mono',monospace;font-size:20px;font-weight:600;text-align:center;color:var(--amarelo);margin:6px 0;background:var(--bg);border-radius:6px;padding:5px}
  .comp-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;padding:4px 8px;border-radius:6px}
  .comp-row.acerto-placar{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.3)}
  .comp-row.acerto-vencedor{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3)}
  .comp-row.erro{background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.2)}
  .comp-row.sem-palpite{background:var(--bg3);border:1px solid var(--border)}
  .comp-jogador{font-size:12px;font-weight:600}
  .comp-placar{font-family:'Roboto Mono',monospace;font-size:13px;font-weight:600}
  .comp-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px}
  .badge-placar{background:var(--acerto-placar);color:#000}
  .badge-vencedor{background:var(--amarelo);color:#000}
  .badge-erro{background:var(--erro);color:#fff}
  .badge-sem,.badge-pendente{background:var(--border);color:var(--muted)}

  .no-selection{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--muted);text-align:center;gap:8px}
  .no-selection .icon{font-size:32px}
  .no-selection p{font-size:12px}

  .col::-webkit-scrollbar{width:3px}
  .col::-webkit-scrollbar-track{background:transparent}
  .col::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

  @media(max-width:768px){
    .main{grid-template-columns:1fr;height:auto}
    .col{border-right:none;border-bottom:1px solid var(--border);height:380px}
  }
</style>
</head>

<header>
  <div class="header-title">Bolão <span>Copa</span> 2026 🏆</div>
  <div id="sync-status" style="font-size:11px;color:#7a8aaa;font-family:'Roboto Mono',monospace">⏳ conectando...</div>
</header>

<div class="ranking-bar">
  <span class="ranking-label">🏆 Ranking</span>
  <div id="ranking-container" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  <span style="margin-left:auto;font-size:10px;color:var(--muted);font-family:'Roboto Mono',monospace">
    <span style="color:var(--acerto-placar)">■</span> Placar exato = 3pts &nbsp;
    <span style="color:var(--amarelo)">■</span> Vencedor = 1pt
  </span>
</div>

<div class="participantes-bar">
  <span class="participantes-label">👥 Participantes:</span>
  <div id="chips-container" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <div class="add-participante">
    <input type="text" id="novo-participante" placeholder="Nome..." maxlength="20" onkeydown="if(event.key==='Enter')addParticipante()">
    <button onclick="addParticipante()">+ Adicionar</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="setFase('grupos',this)">Fase de Grupos</button>
  <button class="tab" onclick="setFase('r32',this)">Oitavas (R32)</button>
  <button class="tab" onclick="setFase('r16',this)">Round of 16</button>
  <button class="tab" onclick="setFase('quartas',this)">Quartas</button>
  <button class="tab" onclick="setFase('semi',this)">Semifinais</button>
  <button class="tab" onclick="setFase('bronze',this)">3º Lugar</button>
  <button class="tab" onclick="setFase('final',this)">Final</button>
</div>

<div class="main">
  <div class="col"><div class="col-header">⚽ Jogos</div><div id="jogos-list"><div class="no-selection"><div class="icon">⏳</div><p>Carregando...</p></div></div></div>
  <div class="col"><div class="col-header">🎯 Palpites</div><div id="palpites-panel"><div class="no-selection"><div class="icon">👈</div><p>Selecione um jogo ao lado</p></div></div></div>
  <div class="col"><div class="col-header">📊 Comparação</div><div id="comp-panel"><div class="no-selection"><div class="icon">📋</div><p>Selecione um jogo para ver<br>os palpites comparados</p></div></div></div>
</div>

  const code = FLAG_CODES[team];

}
function flagImg(team){
  const url = flagUrl(team);

  return `<img src="${url}" class="team-flag-img" alt="${team}" onerror="this.style.display='none'">`;

// ─── STATE ──────────────────────────────────────────────────────────────
let state = {
  fase:'grupos',
  selectedGame:null,
  participantes:['Rodrigo','Rafael','Leo'],
  palpites:{},
  resultados:{},
};

// ─── FIREBASE ───────────────────────────────────────────────────────────
const dbRef = ref(db,'bolao2026');
onValue(dbRef, snap => {
  const d = snap.val()||{};
  state.palpites = d.palpites||{};
  state.resultados = d.resultados||{};
  if(d.participantes) state.participantes = d.participantes;
  document.getElementById('sync-status').textContent='✅ sincronizado';
  render();
}, ()=>{ document.getElementById('sync-status').textContent='❌ erro'; });

async function fbSet(path,val){
  document.getElementById('sync-status').textContent='⏳ salvando...';
  await set(ref(db,path),val);
}

// ─── PONTUAÇÃO ──────────────────────────────────────────────────────────
function calcPontos(){
  const pts={};
  state.participantes.forEach(p=>pts[p]=0);
  for(const[gid,res] of Object.entries(state.resultados)){
    const ps=state.palpites[gid]||{};
    for(const jog of state.participantes){
      const p=ps[jog];
      if(!p) continue;
      if(p.c===res.c&&p.f===res.f) pts[jog]+=3;
      else if((p.c>p.f&&res.c>res.f)||(p.c<p.f&&res.c<res.f)||(p.c===p.f&&res.c===res.f)) pts[jog]+=1;
    }
  }
  return pts;
}
function getRT(p,res){
  if(!res) return 'pendente';
  if(!p) return 'sem';
  if(p.c===res.c&&p.f===res.f) return 'placar';
  if((p.c>p.f&&res.c>res.f)||(p.c<p.f&&res.c<res.f)||(p.c===p.f&&res.c===res.f)) return 'vencedor';
  return 'erro';
}

// ─── RENDER ─────────────────────────────────────────────────────────────
function render(){
  renderRanking(); renderChips(); renderJogos();
  if(state.selectedGame){ renderPalpites(state.selectedGame); renderComp(state.selectedGame); }
}

function renderRanking(){
  const pts=calcPontos();
  const sorted=state.participantes.slice().sort((a,b)=>pts[b]-pts[a]);
  const cls=['gold','silver','bronze'];
  const em=['🥇','🥈','🥉'];
  document.getElementById('ranking-container').innerHTML=sorted.map((j,i)=>`
    <div class="ranking-item">
      <span class="ranking-pos ${cls[i]||''}">${em[i]||'🏅'}</span>
      <span class="ranking-name">${j}</span>
      <span class="ranking-pts">${pts[j]||0}pts</span>
    </div>`).join('');
}

function renderChips(){
  document.getElementById('chips-container').innerHTML=state.participantes.map(p=>`
    <div class="participante-chip">
      ${p}
      <span class="remove-btn" onclick="removeParticipante('${p}')">×</span>
    </div>`).join('');
}

function renderJogos(){
  const jogos=JOGOS[state.fase];
  let html='', lastGrp='';
  jogos.forEach(j=>{
    if(j.grupo && j.grupo!==lastGrp){
      html+=`<div class="grupo-label">Grupo ${j.grupo}</div>`;
      lastGrp=j.grupo;
    }
    const res=state.resultados[j.id];
    const sel=state.selectedGame?.id===j.id;
    const isTBD=j.casa==='TBD';
    html+=`
      <div class="game-card${sel?' selected':''}" onclick="selectGame('${state.fase}','${j.id}')">
        <span class="game-status-badge ${res?'badge-done':'badge-upcoming'}">${res?`${res.c}–${res.f}`:j.hora}</span>
        <div class="game-meta"><span>${j.data} • BRT</span><span>${j.estadio}</span></div>
        <div class="game-teams">
          <div class="team-block home">${isTBD?'':'<span class="team-name">'+j.casa+'</span>'}${isTBD?'<span style="color:var(--muted);font-size:12px">A definir</span>':flagImg(j.casa)}</div>
          <span class="vs-sep">×</span>
          <div class="team-block away">${isTBD?flagImg(j.fora)+'<span style="color:var(--muted);font-size:12px">A definir</span>':flagImg(j.fora)+'<span class="team-name">'+j.fora+'</span>'}</div>
        </div>
      </div>`;
  });
  document.getElementById('jogos-list').innerHTML=html;
}

function renderPalpites(jogo){
  const ps=state.palpites[jogo.id]||{};
  const res=state.resultados[jogo.id];
  const isTBD=jogo.casa==='TBD';
  document.getElementById('palpites-panel').innerHTML=`
    <div class="palpite-card">
      <div class="palpite-game-info">${jogo.data} • ${jogo.hora} BRT • ${jogo.estadio}</div>
      <div class="palpite-game-name">
        ${isTBD?'A definir × A definir':flagImg(jogo.casa)+' '+jogo.casa+' × '+jogo.fora+' '+flagImg(jogo.fora)}
      </div>
      ${state.participantes.map(jog=>{
        const p=ps[jog];
        return `<div class="palpite-jogador">
          <span class="jogador-label">${jog}</span>
          <div class="placar-inputs">
            <input type="number" id="p_${jog}_c" min="0" max="20" value="${p!=null?p.c:''}" placeholder="0">
            <span class="placar-sep">×</span>
            <input type="number" id="p_${jog}_f" min="0" max="20" value="${p!=null?p.f:''}" placeholder="0">
          </div>
          <button class="btn-salvar-small" onclick="salvarPalpite('${jogo.id}','${jog}')">Salvar</button>
        </div>`;
      }).join('')}
      <div class="resultado-form">
        <div class="resultado-label">📋 Resultado Real (admin)</div>
        <div style="display:flex;align-items:center;gap:8px">
          <input type="number" id="res_c" min="0" max="20" value="${res!=null?res.c:''}" placeholder="0" style="width:38px;text-align:center;background:var(--bg);border:1px solid var(--amarelo);border-radius:6px;color:var(--amarelo);font-family:'Roboto Mono',monospace;font-size:15px;font-weight:600;padding:4px">
          <span class="placar-sep" style="color:var(--amarelo)">×</span>
          <input type="number" id="res_f" min="0" max="20" value="${res!=null?res.f:''}" placeholder="0" style="width:38px;text-align:center;background:var(--bg);border:1px solid var(--amarelo);border-radius:6px;color:var(--amarelo);font-family:'Roboto Mono',monospace;font-size:15px;font-weight:600;padding:4px">
          <button class="btn-resultado" onclick="salvarResultado('${jogo.id}')">✓ Confirmar</button>
        </div>
      </div>
    </div>`;
}

function renderComp(jogo){
  const ps=state.palpites[jogo.id]||{};
  const res=state.resultados[jogo.id];
  const pts=calcPontos();
  const badges={
    placar:`<span class="comp-badge badge-placar">+3pts 🎯</span>`,
    vencedor:`<span class="comp-badge badge-vencedor">+1pt ✓</span>`,
    erro:`<span class="comp-badge badge-erro">0pts ✗</span>`,
    sem:`<span class="comp-badge badge-sem">Sem palpite</span>`,
    pendente:`<span class="comp-badge badge-pendente">Aguardando</span>`,
  };
  const rows=state.participantes.map(jog=>{
    const p=ps[jog]; const tipo=getRT(p,res);
    return `<div class="comp-row ${tipo==='pendente'?'sem-palpite':tipo}">
      <span class="comp-jogador">${jog}</span>
      <span class="comp-placar">${p!=null?`${p.c} × ${p.f}`:'— × —'}</span>
      ${badges[tipo]}
    </div>`;
  }).join('');
  const em=['🥇','🥈','🥉'];
  document.getElementById('comp-panel').innerHTML=`
    <div class="comp-card">
      <div class="comp-game-name">${jogo.casa} × ${jogo.fora}</div>
      <div class="comp-resultado-real">${res?`${res.c} — ${res.f}`:'Aguardando resultado'}</div>
      ${rows}
    </div>
    <div class="comp-card">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:var(--muted);margin-bottom:8px">Placar geral</div>
      ${state.participantes.slice().sort((a,b)=>(pts[b]||0)-(pts[a]||0)).map((j,i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:13px">${em[i]||'🏅'} ${j}</span>
          <span style="font-family:'Roboto Mono',monospace;font-size:15px;font-weight:700;color:var(--amarelo)">${pts[j]||0}pts</span>
        </div>`).join('')}
    </div>`;
}

// ─── ACTIONS ────────────────────────────────────────────────────────────
window.setFase = (fase,btn)=>{
  state.fase=fase; state.selectedGame=null;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('palpites-panel').innerHTML=`<div class="no-selection"><div class="icon">👈</div><p>Selecione um jogo ao lado</p></div>`;
  document.getElementById('comp-panel').innerHTML=`<div class="no-selection"><div class="icon">📋</div><p>Selecione um jogo para ver<br>os palpites comparados</p></div>`;
  renderJogos();
};
window.selectGame=(fase,id)=>{
  state.selectedGame=JOGOS[state.fase].find(j=>j.id===id);
  renderJogos(); renderPalpites(state.selectedGame); renderComp(state.selectedGame);
};
window.salvarPalpite=async(gameId,jogador)=>{
  const c=document.getElementById(`p_${jogador}_c`).value;
  const f=document.getElementById(`p_${jogador}_f`).value;
  if(c===''||f==='') return alert('Preencha o placar!');
  await fbSet(`bolao2026/palpites/${gameId}/${jogador}`,{c:parseInt(c),f:parseInt(f)});
};
window.salvarResultado=async(gameId)=>{
  const c=document.getElementById('res_c').value;
  const f=document.getElementById('res_f').value;
  if(c===''||f==='') return alert('Preencha o resultado!');
  await fbSet(`bolao2026/resultados/${gameId}`,{c:parseInt(c),f:parseInt(f)});
};
window.addParticipante=async()=>{
  const inp=document.getElementById('novo-participante');
  const nome=inp.value.trim();
  if(!nome) return;
  if(state.participantes.includes(nome)) return alert('Já existe!');
  state.participantes.push(nome);
  await fbSet('bolao2026/participantes',state.participantes);
  inp.value='';
};
window.removeParticipante=async(nome)=>{
  if(state.participantes.length<=1) return alert('Precisa ter ao menos 1 participante!');
  if(!confirm(`Remover ${nome}?`)) return;
  state.participantes=state.participantes.filter(p=>p!==nome);
  await fbSet('bolao2026/participantes',state.participantes);
};
</script>
